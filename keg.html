<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kegiatan PMR - Galeri</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
</head>

<body>
 
  <nav>
    <div class="footers">
      <img src="img/pmi.png" alt="Logo_PMI">
      <a class="f-class">PALANG MERAH REMAJA</a>
    </div>

    <div id="menu-item" class="menu-item">
      <i class="ph ph-list"></i>
    </div>

    <ul id="menu-list" class="hidden">
      <li><a href="index.html">Home</a></li>
      <li><a href="materi.html" class="active">Materi</a></li>
      <li><a href="keg.html">Kegiatan</a></li>
      <li><a href="cr.html">Credit</a></li>
    </ul>
  </nav>

  <!-- Upload UI -->
  <section class="uploader" aria-labelledby="upload-heading">
    <div class="info">
      <h2 id="upload-heading">Aktivitas PMR SMKN 2 BANDUNG</h2>
      <div class="small">Telusuri Aktivitas Kita</div>
    </div>
    <div class="uploader-controls">
      <label for="fileInput" class="file-label">Pilih Foto</label>
      <input id="fileInput" type="file" accept="image/*">
      <input id="titleInput" type="text" placeholder="Activity Title" aria-label="Activity Title">
      <input id="descInput" type="text" placeholder="Description" aria-label="Activity Description">
      <div class="actions">
        <button id="addBtn" class="btn-icon" title="Tambah">📤</button>
      </div>
    </div>
  </section>

  <!-- Gallery grid (fixed 15 slots visually) -->
  <section id="gallery" class="gallery-container" aria-live="polite">
    <!-- JS will populate up to 15 cards; empty slots show placeholders -->
  </section>

  <!-- Instagram-like Modal -->
  <div id="igModal" class="ig-modal" role="dialog" aria-hidden="true">
    <div class="ig-modal-content">
      <button class="ig-close" id="igClose" aria-label="Tutup">✕</button>
      <div class="ig-left">
        <img id="igImage" src="" alt="Foto kegiatan">
      </div>
      <div class="ig-right">
        <h3 id="igTitle">Judul Kegiatan</h3>
        <p id="igDesc">Deskripsi kegiatan akan tampil di sini.</p>
        <div class="ig-actions">
          <button id="igEdit" class="btn-icon">Edit</button>
          <button id="igSave" class="btn-icon" style="display:none">Save</button>
          <button id="igDelete" class="btn-icon">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
